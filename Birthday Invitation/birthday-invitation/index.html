<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You're Invited! 🐻</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body class="envelope-page">

  <!-- Floating bear paws background -->
  <div class="paw-bg"></div>

  <!-- Envelope wrapper -->
  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="envelope" id="envelope">
      <div class="envelope-flap" id="flap"></div>
      <div class="envelope-body">
        <div class="envelope-letter" id="letter">
          <span class="bear-icon">🐻</span>
          <h2>You have a special message...</h2>
          <p>Tap to open</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Click overlay -->
  <div class="click-hint" id="clickHint">
    <div class="pulse-ring"></div>
    <span>Open Your Invitation</span>
  </div>

  <script src="js/envelope.js"></script>
</body>
</html>
